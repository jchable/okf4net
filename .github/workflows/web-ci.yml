# Type-checks, tests, and builds web/ (Vite + React SSG) on every change that
# touches it, so regressions are caught at PR time instead of at deploy
# (pages.yml only builds, and only on push to main).
name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Gated at `high` rather than the default, deliberately. Two moderate
      # react-router advisories are knowingly carried and cannot be fixed on
      # this dependency tree — see web/SECURITY-NOTES.md for the analysis. A
      # strict gate would need a suppression list, and a stale entry there
      # hides the next real advisory; this fails on anything high or critical
      # while staying quiet about the two we have already assessed.
      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build
