name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CLAUDE.md"
  pull_request:
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CLAUDE.md"

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OKF4net.sln

      - name: Build
        run: dotnet build OKF4net.sln -c Release --no-restore

      - name: Test
        run: dotnet test OKF4net.sln -c Release --no-build --filter "Category!=ContainerIntegration"

  format:
    name: code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify formatting
        run: dotnet format OKF4net.sln --verify-no-changes

  viewer-security:
    # The viewer's XSS defence lives in JavaScript (src/OKF4net.Viewer/Assets/viewer.js),
    # which the xunit suite cannot execute -- its tests there are source-text smoke checks
    # that stay green even if the sanitizer is gutted. This job is the only automated
    # guard on that control, and it matters most when marked.min.js is re-vendored.
    name: viewer sanitizer (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/viewer-security-check/package-lock.json

      # `npm test`'s pretest step generates the site the interactive-viewer
      # cases load, with the real okf-render.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install harness dependencies
        working-directory: tools/viewer-security-check
        run: npm ci

      - name: Run hostile-payload harness
        working-directory: tools/viewer-security-check
        run: npm test

  # The `okf` dotnet tool (OKF4net.Cli on nuget.org) has no other guard: the
  # in-process CliTests never see the package, its runtimeconfig or the tool
  # shim. This job packs it the way release.yml does, checks what the package
  # holds, then consumes it the way a user's CI would -- a committed tool
  # manifest, `dotnet tool restore` in a fresh clone, `dotnet okf validate` --
  # and asserts both verdicts' exit codes. Ubuntu and Windows only: the tool is
  # IL, so macOS would exercise the same bytes through the same Unix shim.
  dotnet-tool:
    name: dotnet tool smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # A version no feed can already hold. Once OKF4net.Cli is on nuget.org,
      # the declared version is usually published too, and an install that also
      # queries nuget.org could then take that copy instead of this build.
      - name: Derive a CI-only version
        shell: pwsh
        run: |
          $declared = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]*)</Version>').Matches[0].Groups[1].Value
          echo "TOOL_VERSION=$declared-ci.${{ github.run_id }}.${{ github.run_attempt }}" >> $env:GITHUB_ENV
          echo "TOOL_FEED=${{ runner.temp }}/okf-tool-feed" >> $env:GITHUB_ENV

      - name: Pack the okf tool
        shell: pwsh
        run: |
          dotnet pack src/OKF4net.Cli/OKF4net.Cli.csproj -c Release -o $env:TOOL_FEED -p:Version=$env:TOOL_VERSION
          if ($LASTEXITCODE -ne 0) { throw "dotnet pack failed" }

      - name: Package holds the tool, its README and NOTICE, and the runtime settings it needs
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = Join-Path $env:TOOL_FEED "OKF4net.Cli.$env:TOOL_VERSION.nupkg"
          if (-not (Test-Path $nupkg)) { throw "package not found: $nupkg" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $nupkg).Path)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            $entry = $zip.GetEntry('tools/net10.0/any/okf.runtimeconfig.json')
            if (-not $entry) { throw "no tools/net10.0/any/okf.runtimeconfig.json in $nupkg" }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try { $runtimeConfig = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }

          foreach ($required in 'tools/net10.0/any/okf.dll', 'tools/net10.0/any/OKF4net.dll',
                                'tools/net10.0/any/DotnetToolSettings.xml', 'README.md', 'NOTICE') {
            if ($entries -notcontains $required) { throw "$nupkg lacks $required" }
          }
          # Portable means IL only: a runtimes/ folder or a native okf
          # executable would mean PublishAot leaked into the pack.
          $native = @($entries | Where-Object { $_ -like 'runtimes/*' -or $_ -like 'tools/*/okf' -or $_ -like 'tools/*/okf.exe' })
          if ($native) { throw "$nupkg carries native payload: $($native -join ', ')" }
          # OKF4net.xml is excluded by AllowedReferenceRelatedFileExtensions.
          $docs = @($entries | Where-Object { $_ -like 'tools/*.xml' -and $_ -notlike '*/DotnetToolSettings.xml' })
          if ($docs) { throw "$nupkg carries API documentation: $($docs -join ', ')" }

          $options = $runtimeConfig.runtimeOptions
          if ($options.rollForward -ne 'Major') { throw "runtimeconfig rollForward is '$($options.rollForward)', expected Major" }
          if ($options.configProperties.'System.Globalization.Invariant' -ne $true) { throw "runtimeconfig does not enable invariant globalization" }
          Write-Host "OK: $nupkg holds $($entries.Count) entries, rollForward Major, invariant globalization"

      - name: A fresh clone restores the pinned tool and gates on its verdict
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $author = Join-Path $env:RUNNER_TEMP 'okf-tool-author'
          $clone = Join-Path $env:RUNNER_TEMP 'okf-tool-clone'
          New-Item -ItemType Directory -Force -Path $author, $clone | Out-Null

          # The author pins the tool in a manifest...
          Push-Location $author
          dotnet new tool-manifest
          if ($LASTEXITCODE -ne 0) { throw "dotnet new tool-manifest failed" }
          dotnet tool install OKF4net.Cli --version $env:TOOL_VERSION --add-source $env:TOOL_FEED
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install (manifest) failed" }
          $manifest = Get-ChildItem -Recurse -Filter dotnet-tools.json | Select-Object -First 1
          if (-not $manifest) { throw "no dotnet-tools.json written" }
          Pop-Location

          # ...and a clone that holds only that manifest gets the same tool back.
          $relative = [System.IO.Path]::GetRelativePath($author, $manifest.FullName)
          $target = Join-Path $clone $relative
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          Copy-Item $manifest.FullName $target
          Push-Location $clone
          dotnet tool restore --add-source $env:TOOL_FEED
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore failed" }

          $actual = dotnet okf --version
          Write-Host "expected=$env:TOOL_VERSION actual=$actual"
          if ($actual -notlike "okf $env:TOOL_VERSION *") { throw "restored tool reports '$actual', expected version $env:TOOL_VERSION" }

          dotnet okf validate (Join-Path $repo 'tests/fixtures/appendix_a')
          if ($LASTEXITCODE -ne 0) { throw "okf validate failed on a conformant bundle (exit $LASTEXITCODE)" }

          dotnet okf validate (Join-Path $repo 'tests/fixtures/okf_v02_reserved')
          if ($LASTEXITCODE -ne 1) { throw "okf validate exited $LASTEXITCODE on a non-conformant bundle, expected 1" }
          Pop-Location

          # The global form goes through a different shim (an apphost on
          # Windows): install it into a tool path and ask it its version.
          $toolPath = Join-Path $env:RUNNER_TEMP 'okf-tool-global'
          dotnet tool install OKF4net.Cli --version $env:TOOL_VERSION --add-source $env:TOOL_FEED --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install --tool-path failed" }
          $shim = Join-Path $toolPath ($IsWindows ? 'okf.exe' : 'okf')
          $actual = & $shim --version
          if ($actual -notlike "okf $env:TOOL_VERSION *") { throw "global shim reports '$actual', expected version $env:TOOL_VERSION" }
          Write-Host "OK: manifest restore, both verdicts and the global shim all run $env:TOOL_VERSION"

          # The expected exit 1 above must not become this step's exit code.
          $global:LASTEXITCODE = 0

  # Exercises the real release-packaging script (packaging/Publish-Cli.ps1) on
  # every CI run, not just on a tag push, so a broken archive/permission bug
  # is caught here instead of on the first real release. This covers
  # linux-x64, osx-arm64 and win-x64 -- linux-arm64 and osx-x64 have no
  # matching free-tier runner label available to a CI job on every push, so
  # they stay release-only (built for real in release.yml's cli-binaries
  # matrix, just not double-checked here). That is a known residual gap, not
  # an oversight.
  #
  # Publishes and smoke-runs BOTH Native AOT binaries -- okf and okf-render.
  # okf-render (OKF4net.Render, consuming OKF4net.Viewer) has no other CI
  # coverage: nothing else in this workflow publishes it, so an AOT/trim
  # regression in the viewer (GetManifestResourceStream for its embedded
  # assets, GetCustomAttribute<AssemblyInformationalVersionAttribute> for its
  # version output) would otherwise first surface during a tagged release,
  # after NuGet packages have already been pushed.
  aot-publish:
    name: Native AOT publish smoke test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # check-index.js executes the okf-index.js the native okf-render writes.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Derive declared version
        shell: pwsh
        run: |
          $declared = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]*)</Version>').Matches[0].Groups[1].Value
          echo "DECLARED=$declared" >> $env:GITHUB_ENV

      - name: Publish + archive okf (packaging/Publish-Cli.ps1)
        shell: pwsh
        run: packaging/Publish-Cli.ps1 -Rid ${{ matrix.rid }} -Version $env:DECLARED -OutDir dist -ProjectDir src/OKF4net.Cli -BinName okf

      - name: Publish + archive okf-render (packaging/Publish-Cli.ps1)
        shell: pwsh
        run: packaging/Publish-Cli.ps1 -Rid ${{ matrix.rid }} -Version $env:DECLARED -OutDir dist -ProjectDir src/OKF4net.Render -BinName okf-render

      - name: Archives exist, hold exactly their declared files, and (on Unix) their binaries are executable
        shell: pwsh
        run: |
          $isWin = '${{ matrix.rid }}'.StartsWith('win-')
          $ext = if ($isWin) { 'zip' } else { 'tar.gz' }
          $exe = if ($isWin) { '.exe' } else { '' }

          # Each archive's files, exactly (packaging/New-ReleaseArchive.ps1):
          # the binary AT THE ROOT -- install.sh extracts "$BIN" from there and
          # winget's RelativeFilePath points there -- and, for okf-render, the
          # licences that must travel with it: NOTICE, the LGPL and GPL texts,
          # the SIL OFL text of each font family OKF4net.Viewer embeds, and the
          # MIT licence text of the marked it embeds.
          $expected = @{
            'okf'        = @("okf$exe")
            'okf-render' = @("okf-render$exe", 'NOTICE', 'LICENSE', 'LICENSE.GPL-3.0',
                             'licenses/OFL-Inter.txt', 'licenses/OFL-InterTight.txt', 'licenses/OFL-SpaceMono.txt',
                             'licenses/marked-LICENSE.md')
          }

          function Get-ArchiveEntries([string]$archive) {
            if ($isWin) {
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
              try { $names = @($zip.Entries | ForEach-Object { $_.FullName }) } finally { $zip.Dispose() }
            } else {
              $names = @(tar tzf $archive)
              if ($LASTEXITCODE -ne 0) { throw "tar list failed for $archive" }
            }
            # Directory entries hold no file; a zip may spell its separator "\".
            @($names | ForEach-Object { $_ -replace '\\', '/' } | Where-Object { -not $_.EndsWith('/') })
          }

          function Test-Archive([string]$bin) {
            $archive = "dist/$bin-$env:DECLARED-${{ matrix.rid }}.$ext"
            if (-not (Test-Path $archive)) { throw "archive not found: $archive" }
            $len = (Get-Item $archive).Length
            if ($len -eq 0) { throw "archive is empty: $archive" }
            if (-not (Test-Path "$archive.sha256")) { throw "sha256 sidecar not found: $archive.sha256" }
            Write-Host "OK: $archive ($len bytes)"

            $entries = Get-ArchiveEntries $archive
            $diff = Compare-Object -CaseSensitive -ReferenceObject $expected[$bin] -DifferenceObject $entries
            if ($diff) {
              $missing = @($diff | Where-Object SideIndicator -eq '<=' | ForEach-Object InputObject)
              $extra = @($diff | Where-Object SideIndicator -eq '=>' | ForEach-Object InputObject)
              throw "$archive does not hold exactly its declared files -- missing: [$($missing -join ', ')]; unexpected: [$($extra -join ', ')]"
            }
            Write-Host "OK: $archive holds $($entries -join ', ')"

            if (-not $isWin) {
              # The bug this whole packaging change exists to prevent:
              # Compress-Archive does not preserve the Unix executable bit, so a
              # naively-zipped Unix binary would extract non-executable. tar
              # preserves file mode, so extract the *archived* binary here and
              # check its permission bit directly, rather than trusting that
              # what went into the archive is what comes out.
              $extractDir = "dist/extract-${{ matrix.rid }}-$bin"
              New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
              tar xzf $archive -C $extractDir
              if ($LASTEXITCODE -ne 0) { throw "tar extract failed for $archive" }
              $mode = [System.IO.File]::GetUnixFileMode("$extractDir/$bin")
              if (($mode -band [System.IO.UnixFileMode]::UserExecute) -eq 0) {
                throw "$bin extracted from $archive is not executable (mode: $mode)"
              }
              Write-Host "OK: $bin extracted from archive is executable ($mode)"
            }
          }

          Test-Archive 'okf'
          Test-Archive 'okf-render'

      - name: Locate published okf
        shell: pwsh
        run: |
          $name = if ('${{ matrix.rid }}'.StartsWith('win-')) { 'okf.exe' } else { 'okf' }
          $bin = Get-ChildItem -Recurse -Path src/OKF4net.Cli/bin/Release -Filter $name |
            Where-Object { $_.FullName -match '[\\/]publish[\\/]' } | Select-Object -First 1
          if (-not $bin) { throw "published binary $name not found" }
          echo "OKF_BIN=$($bin.FullName)" >> $env:GITHUB_ENV

      - name: Locate published okf-render
        shell: pwsh
        run: |
          $name = if ('${{ matrix.rid }}'.StartsWith('win-')) { 'okf-render.exe' } else { 'okf-render' }
          $bin = Get-ChildItem -Recurse -Path src/OKF4net.Render/bin/Release -Filter $name |
            Where-Object { $_.FullName -match '[\\/]publish[\\/]' } | Select-Object -First 1
          if (-not $bin) { throw "published binary $name not found" }
          echo "OKF_RENDER_BIN=$($bin.FullName)" >> $env:GITHUB_ENV

      - name: Run published okf
        shell: pwsh
        run: |
          & $env:OKF_BIN validate tests/fixtures/appendix_a
          if ($LASTEXITCODE -ne 0) { throw "okf validate failed" }

      - name: Run published okf-render
        shell: pwsh
        run: |
          $outDir = "dist/render-smoke-${{ matrix.rid }}"
          & $env:OKF_RENDER_BIN tests/fixtures/appendix_a --out $outDir
          if ($LASTEXITCODE -ne 0) { throw "okf-render failed" }
          if (-not (Test-Path "$outDir/index.html")) { throw "okf-render did not write $outDir/index.html" }
          $indexScript = "$outDir/assets/okf-index.js"
          if (-not (Test-Path $indexScript)) { throw "okf-render did not write $indexScript" }
          node tools/viewer-security-check/check-index.js $indexScript
          if ($LASTEXITCODE -ne 0) { throw "$indexScript does not execute as a usable site index" }
          # Embedded assets come out of the NATIVE binary too (GetManifestResourceNames
          # under AOT): the P1.1 scripts, the font and marked licences, and each of the four
          # woff2 fonts by name (spec section 11.0, A26).
          $assets = @("okf-shapes.js", "okf-page.js",
                      "fonts/OFL-Inter.txt", "fonts/OFL-InterTight.txt", "fonts/OFL-SpaceMono.txt",
                      "licenses/marked-LICENSE.md",
                      "fonts/inter-latin.woff2", "fonts/inter-tight-latin.woff2",
                      "fonts/space-mono-400-latin.woff2", "fonts/space-mono-700-latin.woff2")
          foreach ($asset in $assets) {
            if (-not (Test-Path "$outDir/assets/$asset")) { throw "okf-render did not write assets/$asset" }
          }
          # The graph page (spec section 12.5): found through the index's Global graph
          # link (graph.html, or graph-1.html... on a name collision, A25).
          $graphLink = Select-String -Path "$outDir/index.html" -Pattern 'id="okf-global-graph"[^>]*href="([^"#]+)' | Select-Object -First 1
          if (-not $graphLink) { throw "okf-render wrote no Global graph link in $outDir/index.html" }
          $graphPage = "$outDir/" + $graphLink.Matches[0].Groups[1].Value
          if (-not (Test-Path $graphPage)) { throw "okf-render did not write $graphPage" }
          if (-not (Select-String -Path $graphPage -Pattern 'id="okf-graph-layout"' -Quiet)) { throw "$graphPage lacks the graph skeleton" }
          foreach ($script in 'okf-resize.js', 'okf-sim.js', 'okf-graph.js', 'okf-local.js') {
            if (-not (Test-Path "$outDir/assets/$script")) { throw "okf-render did not write assets/$script" }
          }
          Write-Host "OK: okf-render wrote $outDir/index.html, an executable $indexScript, the P1.1 scripts, the fonts and the graph page $graphPage"

      # `okf --version` / `okf-render --version` each read
      # AssemblyInformationalVersionAttribute at runtime. The in-process
      # CliTests / OkfRenderCliTests cannot prove that survives Native AOT, so
      # the published binaries are asked directly here: a trimmed-away
      # attribute would print the "0.0.0-unknown" fallback and this fails.
      - name: Published okf reports the build version
        shell: pwsh
        run: |
          $actual = & $env:OKF_BIN --version
          Write-Host "declared=$env:DECLARED actual=$actual"
          if ($actual -notlike "okf $env:DECLARED *") {
            throw "published binary reports '$actual', expected version $env:DECLARED"
          }

      - name: Published okf-render reports the build version
        shell: pwsh
        run: |
          $actual = & $env:OKF_RENDER_BIN --version
          Write-Host "declared=$env:DECLARED actual=$actual"
          if ($actual -notlike "okf-render $env:DECLARED *") {
            throw "published binary reports '$actual', expected version $env:DECLARED"
          }
