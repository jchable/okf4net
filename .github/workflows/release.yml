name: Release

on:
  push:
    tags: ["v*"]

jobs:
  nuget:
    name: pack & publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test OKF4net.sln -c Release

      - name: Pack
        run: >
          dotnet pack src/OKF4net/OKF4net.csproj -c Release -o artifacts
          -p:Version=$VERSION
          -p:ContinuousIntegrationBuild=true

      - name: Pack (Agents)
        run: >
          dotnet pack src/OKF4net.Agents/OKF4net.Agents.csproj -c Release -o artifacts
          -p:Version=$VERSION
          -p:ContinuousIntegrationBuild=true

      - name: Pack (Catalog)
        run: >
          dotnet pack src/OKF4net.Catalog/OKF4net.Catalog.csproj -c Release -o artifacts
          -p:Version=$VERSION
          -p:ContinuousIntegrationBuild=true

      - name: Pack (Catalog.Hosting)
        run: >
          dotnet pack src/OKF4net.Catalog.Hosting/OKF4net.Catalog.Hosting.csproj -c Release -o artifacts
          -p:Version=$VERSION
          -p:ContinuousIntegrationBuild=true

      # Trusted Publishing: exchanges this job's OIDC token for a short-lived
      # (1 h, single-use) API key — no long-lived secret stored. Requires a
      # trusted publishing policy on nuget.org pointing at this repository and
      # workflow file (release.yml).
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  cli-binaries:
    name: build okf (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Derive version from tag
        shell: pwsh
        run: echo "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_ENV
      - name: Publish + zip
        shell: pwsh
        run: packaging/winget/Publish-Cli.ps1 -Rid ${{ matrix.rid }} -Version $env:VERSION -OutDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: dist/*

  github-release:
    name: publish GitHub Release
    needs: [cli-binaries, nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Build checksums.txt
        run: |
          cd dist
          sha256sum okf-*.zip > checksums.txt
          cat checksums.txt
      - name: Create/attach Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/okf-*.zip
            dist/checksums.txt

  winget-manifests:
    name: generate winget manifests
    needs: github-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Generate manifests
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $base = "https://github.com/${env:GITHUB_REPOSITORY}/releases/download/${env:GITHUB_REF_NAME}"
          $shaX64 = (Get-Content "dist/okf-$ver-win-x64.zip.sha256" -Raw).Trim()
          $shaArm = (Get-Content "dist/okf-$ver-win-arm64.zip.sha256" -Raw).Trim()
          packaging/winget/Generate-Manifests.ps1 -Version $ver `
            -UrlX64 "$base/okf-$ver-win-x64.zip" -Sha256X64 $shaX64 `
            -UrlArm64 "$base/okf-$ver-win-arm64.zip" -Sha256Arm64 $shaArm `
            -OutDir manifests
      - name: Attach manifests to Release
        uses: softprops/action-gh-release@v2
        with:
          files: manifests/*.yaml
