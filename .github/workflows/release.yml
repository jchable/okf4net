name: Release

on:
  push:
    tags: ["v*"]

jobs:
  nuget:
    name: pack & publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test OKF4net.sln -c Release

      - name: Pack
        run: >
          dotnet pack src/OKF4net/OKF4net.csproj -c Release -o artifacts
          -p:Version=$VERSION
          -p:ContinuousIntegrationBuild=true

      # Trusted Publishing: exchanges this job's OIDC token for a short-lived
      # (1 h, single-use) API key — no long-lived secret stored. Requires a
      # trusted publishing policy on nuget.org pointing at this repository and
      # workflow file (release.yml).
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicates
